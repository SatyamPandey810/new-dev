# new-repo/.github/workflows/deploy.yml
name: Deploy New Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Fix workspace permissions
        run: sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Reload Nginx
        run: sudo systemctl reload nginx
